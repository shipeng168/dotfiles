
#user  nobody;
worker_processes  4;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;
#error_log  "pipe:rollback logs/error_log interval=1d baknum=7 maxsize=2G";

#pid        logs/nginx.pid;


events {
    worker_connections  4096;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;
    #access_log  "pipe:rollback logs/access_log interval=1d baknum=7 maxsize=2G"  main;

    sendfile       on;
    #tcp_nopush     on;
    #tcp_nodelay    on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  off;
    server_tokens  off;

	#map $host $local_loop_proxy {
    #    hostnames;
    #    default 0;

    #    "127.0.0.1" 1;
    #}

    map $host $forbidden {
        hostnames;
        default 0;

        #"" 1;
    }

    #limit_rate 100k;

    #limit_conn_zone $binary_remote_addr zone=one:10m;

    #limit_req_zone $binary_remote_addr zone=slow:10m rate=10r/s;

    server {
        listen       8080;
        #listen  127.0.0.1:8080;
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;
        #access_log  "pipe:rollback logs/host.access_log interval=1d baknum=7 maxsize=2G"  main;

        #resolver                     223.6.6.6;
        #resolver            223.6.6.6 ipv6=off;
        #resolver    223.6.6.6 8.8.8.8 ipv6=off;
        #resolver    223.6.6.6 114.114.114.114 ipv6=off;
        resolver     223.6.6.6 114.114.114.114 valid=30m ipv6=off;

        if ($forbidden) {
            return 444;
        #   return 403 " ";
        }

        #proxy_limit_rate 100k;

        #limit_conn one 20;

        #limit_req zone=slow burst=10;

        #proxy_buffering          off;
        #proxy_request_buffering  off;
        #proxy_max_temp_file_size   0;

        #client_max_body_size       0;
        #client_body_buffer_size   2M;
        #client_body_in_file_only off;

        proxy_connect;
       #proxy_connect_allow 80 443 853 8443;
        proxy_connect_allow             all;
        proxy_connect_connect_timeout   35s;
        proxy_connect_read_timeout      65s;
        proxy_connect_send_timeout      35s;

        underscores_in_headers on;
        ignore_invalid_headers off;

        # forward proxy for request
        location / {
			#if ($local_loop_proxy) {
            if ($host = $remote_addr) {
                access_log off;
                return 444;
            }
            #proxy_pass http://$host;
            proxy_pass $scheme://$http_host$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header Proxy-Connection "";
            proxy_set_header Connection "keep-alive";
            #proxy_set_header Connection $sent_http_connection;
            proxy_http_version 1.1;
            #proxy_pass $scheme://$host;
            #proxy_pass $scheme://$host$request_uri;
            #proxy_set_header Host $host:$server_port;
        }

        location /stub_status {
            stub_status  on;
            access_log  off;
            allow 127.0.0.1;
            deny  all;
        }

        location /cyberchef {
            root   html;
            index  index.html;
            access_log  off;
        }

        #location / {
        #    root   html;
        #    index  index.html index.htm;
        #}

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            #root   html;
            access_log off;
            return 444;
            #return 403 " ";
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # pass the Dubbo rpc to Dubbo provider server listening on 127.0.0.1:20880
        #
        #location /dubbo {
        #    dubbo_pass_all_headers on;
        #    dubbo_pass_set args $args;
        #    dubbo_pass_set uri $uri;
        #    dubbo_pass_set method $request_method;
        #
        #    dubbo_pass org.apache.dubbo.samples.tengine.DemoService 0.0.0 tengineDubbo dubbo_backend;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }

    # upstream for Dubbo rpc to Dubbo provider server listening on 127.0.0.1:20880
    #
    #upstream dubbo_backend {
    #    multi 1;
    #    server 127.0.0.1:20880;
    #}

